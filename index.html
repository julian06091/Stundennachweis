<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#007aff">
<title>Stundennachweis</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:600px;margin:auto;padding:20px 16px 40px}h1{font-size:29px;margin:5px 0 2px}.period{color:#007aff;font-weight:600;font-size:17px;margin-bottom:20px}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 5px #00000012}
label{display:block;font-size:13px;font-weight:600;color:#666;margin:10px 0 6px}
input{width:100%;padding:13px;border:1px solid #d1d1d6;border-radius:11px;font-size:17px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;margin-top:14px;background:#007aff;color:#fff}
button.gray{background:#e5e5ea;color:#111}.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
.entry:last-child{border-bottom:0}.small{color:#666;font-size:14px}.status{font-size:14px;line-height:1.4;color:#555}
button.red{width:auto;background:#ff3b30;padding:7px 10px;font-size:13px;margin:0}.green{background:#34c759}
</style>
</head>
<body>
<main>
<h1>Stundennachweis</h1>
<div class="period" id="period">September 2026 · KW 36</div>

<div class="card">
<label>Deine Excel-Vorlage</label>
<input id="file" type="file" accept=".xlsx">
<div id="fileName" class="small" style="margin-top:8px">Noch keine Datei ausgewählt</div>
</div>

<div class="card">
<label>Datum</label>
<input id="date" type="date">
<div class="row">
<div><label>Von</label><input id="from" type="time"></div>
<div><label>Bis</label><input id="to" type="time"></div>
</div>
<label>Tätigkeit</label>
<input id="activity" placeholder="z. B. Lagerarbeiten">
<button id="add">+ Eintrag hinzufügen</button>
</div>

<div class="card">
<div class="status" id="status">Vorlage auswählen, Einträge hinzufügen und anschließend die KW-Datei erzeugen.</div>
<div id="entries"></div>
<button class="green" id="make">KW-Datei erstellen</button>
<button class="gray" id="clear">Liste leeren</button>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let sourceFile=null, entries=[];

function isoToday(){
 const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
 return d.toISOString().slice(0,10);
}
$("date").value=isoToday();

function kwOf(s){
 const d=new Date(s+"T12:00:00"), day=(d.getDay()+6)%7;
 d.setDate(d.getDate()-day+3);
 const first=new Date(d.getFullYear(),0,4);
 return 1+Math.round(((d-first)/86400000-first.getDay()+1)/7);
}
function updatePeriod(){
 if(!$("date").value)return;
 const d=new Date($("date").value+"T12:00:00");
 $("period").textContent=d.toLocaleDateString("de-DE",{month:"long",year:"numeric"})+" · KW "+kwOf($("date").value);
}
function mins(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function render(){
 entries.sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from));
 $("entries").innerHTML=entries.map((e,i)=>{
  const d=e.date.split("-").reverse().join(".");
  return `<div class="entry"><div><b>${d}</b> · ${e.from}–${e.to} Uhr<br><span class="small">${esc(e.activity)} · KW ${kwOf(e.date)}</span></div><button class="red" onclick="removeEntry(${i})">Löschen</button></div>`;
 }).join("");
 $("status").textContent=entries.length ? entries.length+" Eintrag"+(entries.length===1?"":"e")+" bereit." : "Noch keine Einträge.";
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function removeEntry(i){entries.splice(i,1);render()}

$("file").addEventListener("change",e=>{
 sourceFile=e.target.files[0]||null;
 $("fileName").textContent=sourceFile?sourceFile.name:"Noch keine Datei ausgewählt";
});

$("date").addEventListener("change",updatePeriod);

$("add").addEventListener("click",()=>{
 const d=$("date").value,f=$("from").value,t=$("to").value,a=$("activity").value.trim();
 if(!d||!f||!t||!a){alert("Bitte Datum, Von, Bis und Tätigkeit ausfüllen.");return}
 if(mins(t)<=mins(f)){alert("Die Bis-Zeit muss nach der Von-Zeit liegen.");return}
 entries.push({date:d,from:f,to:t,activity:a});
 $("activity").value=""; render(); updatePeriod();
});

$("clear").addEventListener("click",()=>{
 if(confirm("Alle Einträge wirklich löschen?")){entries=[];render()}
});

function xmlEscape(s){
 return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}
function setInlineString(xml, cellRef, value){
 const re=new RegExp('<c r="'+cellRef+'"([^>]*)>[\\\\s\\\\S]*?</c>');
 const simple='<c r="'+cellRef+'"$1 t="inlineStr"><is><t>'+xmlEscape(value)+'</t></is></c>';
 if(re.test(xml)) return xml.replace(re,simple);
 const rowRef=cellRef.match(/\\d+/)[0];
 const rowRe=new RegExp('(<row r="'+rowRef+'"[^>]*>)([\\\\s\\\\S]*?)(</row>)');
 if(rowRe.test(xml)) return xml.replace(rowRe,'$1'+simple+'$2$3');
 return xml;
}
function setNumber(xml, cellRef, value){
 const re=new RegExp('<c r="'+cellRef+'"([^>]*)>[\\\\s\\\\S]*?</c>');
 const simple='<c r="'+cellRef+'"$1 t="n"><v>'+value+'</v></c>';
 if(re.test(xml)) return xml.replace(re,simple);
 const rowRef=cellRef.match(/\\d+/)[0];
 const rowRe=new RegExp('(<row r="'+rowRef+'"[^>]*>)([\\\\s\\\\S]*?)(</row>)');
 if(rowRe.test(xml)) return xml.replace(rowRe,'$1'+simple+'$2$3');
 return xml;
}
function excelDate(dateStr){
 const [y,m,d]=dateStr.split("-").map(Number);
 const utc=Date.UTC(y,m-1,d), base=Date.UTC(1899,11,30);
 return Math.round((utc-base)/86400000);
}
function excelTime(timeStr){
 const [h,m]=timeStr.split(":").map(Number);
 return (h*60+m)/1440;
}
function weekday(dateStr){
 const d=new Date(dateStr+"T12:00:00");
 return ["So.","Mo.","Di.","Mi.","Do.","Fr.","Sa."][d.getDay()];
}
function findFreeRows(xml){
 const used=new Set();
 const re=/<row r="(\d+)"/g; let m;
 while((m=re.exec(xml))) used.add(Number(m[1]));
 const out=[];
 for(let r=8;r<=30;r+=2) if(used.has(r)) out.push(r);
 return out;
}
function setFormulaCache(xml, cellRef, value){
 // Change only the cached value of an existing formula cell.
 const cellRe=new RegExp('(<c\\s+r="'+cellRef+'"[^>]*>)([\\s\\S]*?)(</c>)');
 const m=xml.match(cellRe);
 if(!m) return xml;
 let body=m[2];
 if(!/<f[\s\S]*?<\/f>/.test(body)) return xml;
 if(/<v>[\s\S]*?<\/v>/.test(body)){
   body=body.replace(/<v>[\s\S]*?<\/v>/,'<v>'+value+'</v>');
 } else {
   body=body+'<v>'+value+'</v>';
 }
 return xml.replace(cellRe,m[1]+body+m[3]);
}
function calcEntry(e){
 const [fh,fm]=e.from.split(":").map(Number);
 const [th,tm]=e.to.split(":").map(Number);
 let raw=((th*60+tm)-(fh*60+fm))/60;
 if(raw<0) raw+=24;
 const pause=raw>=6?1:(raw>=4.5?0.5:0);
 return {raw, pause, total:raw-pause, euro:(raw-pause)*14};
}
function cellExists(xml, ref){return new RegExp('<c r="'+ref+'(?:\\"|\\s)').test(xml)}

$("make").addEventListener("click",async()=>{
 if(!sourceFile){alert("Bitte zuerst deine aktuelle KW.xlsx auswählen.");return}
 if(!entries.length){alert("Bitte mindestens einen Eintrag hinzufügen.");return}
 if(typeof JSZip==="undefined"){alert("Die Excel-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.");return}

 try{
  const zip=await JSZip.loadAsync(await sourceFile.arrayBuffer());
  let xml=await zip.file("xl/worksheets/sheet1.xml").async("string");

  // Diese Methode verändert nur die benötigten Zellen direkt im vorhandenen XML.
  // Zeichnungen, Formatierungen, Seitenlayout, Formeln und sonstige Vorlagenteile bleiben erhalten.
  const rows=findFreeRows(xml);
  if(entries.length>rows.length){alert("Die Vorlage hat nicht genug Zeilen für so viele Einträge.");return}

  // Sortiert nach Datum/Zeit und schreibt einen Eintrag pro Zeile.
  entries.sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from));

  // Eingabewerte setzen, vorhandene Formeln unbedingt erhalten.
  // Die Vorlage benutzt jede zweite Zeile als Tageszeile (8,10,12,...).
  for(const r of rows){
    xml=setNumber(xml,"C"+r,0);
    xml=setNumber(xml,"F"+r,0);
    xml=setNumber(xml,"H"+r,0);
    xml=setInlineString(xml,"N"+r,"");
    // Formel-Zwischenergebnisse leeren, damit Excel/der Cache keine alten Werte zeigt.
    xml=setFormulaCache(xml,"A"+r,0);
    xml=setFormulaCache(xml,"I"+r,0);
    xml=setFormulaCache(xml,"J"+r,0);
    xml=setFormulaCache(xml,"K"+r,0);
    xml=setNumber(xml,"L"+r,14);
    xml=setFormulaCache(xml,"M"+r,0);
  }

  let sumRaw=0, sumTotal=0, sumEuro=0;
  entries.forEach((e,i)=>{
    const r=rows[i];
    const c=calcEntry(e);
    sumRaw+=c.raw; sumTotal+=c.total; sumEuro+=c.euro;
    xml=setNumber(xml,"C"+r,excelDate(e.date));
    xml=setNumber(xml,"F"+r,excelTime(e.from));
    xml=setNumber(xml,"H"+r,excelTime(e.to));
    xml=setInlineString(xml,"N"+r,e.activity);
    xml=setFormulaCache(xml,"A"+r,excelDate(e.date));
    xml=setFormulaCache(xml,"I"+r,c.raw);
    xml=setFormulaCache(xml,"J"+r,c.pause);
    xml=setFormulaCache(xml,"K"+r,c.total);
    xml=setNumber(xml,"L"+r,14);
    xml=setFormulaCache(xml,"M"+r,c.euro);
  });
  // Wochen-Summen ebenfalls als berechneten Cache setzen.
  xml=setFormulaCache(xml,"I32",sumRaw);
  xml=setFormulaCache(xml,"K32",sumTotal);
  xml=setFormulaCache(xml,"M32",sumEuro);

  // Monat und KW anhand des ersten Eintrags aktualisieren.
  const first=entries[0];
  const d=new Date(first.date+"T12:00:00");
  const month=d.toLocaleDateString("de-DE",{month:"long"});
  xml=setInlineString(xml,"Q4",month);
  xml=setNumber(xml,"S4",kwOf(first.date));

  // Excel soll die vorhandenen Formeln beim Öffnen neu berechnen.
  let wbxml=await zip.file("xl/workbook.xml").async("string");
  if(/<calcPr\b/.test(wbxml)){
    wbxml=wbxml.replace(/<calcPr\b[^>]*\/>/,'<calcPr fullCalcOnLoad="1" forceFullCalc="1" calcMode="auto"/>');
  }else{
    wbxml=wbxml.replace("</workbook>","<calcPr fullCalcOnLoad=\"1\" forceFullCalc=\"1\" calcMode=\"auto\"/></workbook>");
  }

  zip.file("xl/worksheets/sheet1.xml",xml);
  zip.file("xl/workbook.xml",wbxml);

  const out=await zip.generateAsync({type:"blob",compression:"DEFLATE"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(out);
  a.download="KW"+String(kwOf(first.date)).padStart(2,"0")+".xlsx";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  $("status").textContent="Fertig: KW"+String(kwOf(first.date)).padStart(2,"0")+".xlsx wurde erstellt.";
 }catch(err){
  console.error(err);
  alert("Die Excel-Datei konnte nicht erstellt werden. Bitte die originale KW-Datei auswählen und erneut versuchen.");
 }
});

updatePeriod(); render();
</script>
</body>
</html>
