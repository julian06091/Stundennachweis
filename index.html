<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stundennachweis</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:600px;margin:auto;padding:20px 16px 40px}h1{font-size:29px;margin:5px 0 2px}.period{color:#007aff;font-weight:600;font-size:17px;margin-bottom:20px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 5px #00000012}label{display:block;font-size:13px;font-weight:600;color:#666;margin:10px 0 6px}input{width:100%;padding:13px;border:1px solid #d1d1d6;border-radius:11px;font-size:17px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;margin-top:14px;background:#007aff;color:#fff}button.gray{background:#e5e5ea;color:#111}.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.entry:last-child{border-bottom:0}.small{color:#666;font-size:14px}.status{font-size:14px;line-height:1.4;color:#555}button.red{width:auto;background:#ff3b30;padding:7px 10px;font-size:13px;margin:0}.green{background:#34c759}</style></head>
<body><main>
<h1>Stundennachweis</h1><div class="period" id="period">Noch kein Datum</div>
<div class="card"><label>Excel-Vorlage</label><input id="file" type="file" accept=".xlsx"><div class="small" style="margin-top:8px">Bitte die funktionierende Excel-Vorlage auswählen.</div></div>
<div class="card"><label>Datum</label><input id="date" type="date"><div class="row"><div><label>Von</label><input id="from" type="time"></div><div><label>Bis</label><input id="to" type="time"></div></div><label>Tätigkeit</label><input id="activity" placeholder="z. B. Lagerarbeiten"><button id="add">+ Eintrag hinzufügen</button></div>
<div class="card"><div id="list"><div class="small">Noch keine Einträge.</div></div><button id="make" class="green">KW-Datei erstellen</button><button id="clear" class="gray">Liste leeren</button></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);let sourceFile=null,entries=[];
function kwOf(s){const d=new Date(s+"T12:00:00"),day=(d.getDay()+6)%7;d.setDate(d.getDate()+3-day);const y=d.getFullYear();const first=new Date(y,0,4),fd=(first.getDay()+6)%7;return 1+Math.round((d-first+0)/86400000/7)+Math.floor(fd/7)}
function mins(s){const [h,m]=s.split(":").map(Number);return h*60+m}
function updatePeriod(){const d=$("date").value;if(!d){$("period").textContent="Noch kein Datum";return}const dt=new Date(d+"T12:00:00");$("period").textContent=dt.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})+" · KW "+kwOf(d)}
function calc(e){let raw=(mins(e.to)-mins(e.from))/60;if(raw<0)raw+=24;const pause=raw>=6?1:raw>=4.5?.5:0;return {raw,total:raw-pause,euro:(raw-pause)*14,pause}}
function render(){if(!entries.length){$("list").innerHTML='<div class="small">Noch keine Einträge.</div>';return}entries.sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from));$("list").innerHTML=entries.map((e,i)=>{const c=calc(e);return `<div class="entry"><div><b>${new Date(e.date+"T12:00:00").toLocaleDateString("de-DE")}</b> · ${e.from}–${e.to} Uhr<br><span class="small">${e.activity} · KW ${kwOf(e.date)} · ${c.total.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})} h · ${c.euro.toLocaleString("de-DE",{minimumFractionDigits:2})} €</span></div><button class="red" onclick="delEntry(${i})">Löschen</button></div>`}).join("")}
function delEntry(i){entries.splice(i,1);render()}
$("file").addEventListener("change",e=>{sourceFile=e.target.files[0]||null});$("date").addEventListener("change",updatePeriod);
$("add").addEventListener("click",()=>{const d=$("date").value,f=$("from").value,t=$("to").value,a=$("activity").value.trim();if(!d||!f||!t||!a)return alert("Bitte Datum, Von, Bis und Tätigkeit ausfüllen.");if(mins(t)<=mins(f))return alert("Die Bis-Zeit muss nach der Von-Zeit liegen.");if(entries.length&&kwOf(d)!==kwOf(entries[0].date))return alert("Bitte nur Einträge derselben Kalenderwoche eingeben.");entries.push({date:d,from:f,to:t,activity:a});$("activity").value="";render();updatePeriod()});
$("clear").addEventListener("click",()=>{if(confirm("Alle Einträge wirklich löschen?")){entries=[];render()}});
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;")}
// Ersetzt eine vorhandene Excel-Zelle. Funktioniert sowohl bei <c .../> als auch bei <c ...>...</c>.
function rowBlock(xml,r){
  const re=new RegExp('<row\\b[^>]*\\br="'+r+'"[^>]*>[\\s\\S]*?<\\/row>');
  const m=xml.match(re);
  if(!m) throw new Error('Zeile '+r+' wurde in der Vorlage nicht gefunden.');
  return {text:m[0], index:m.index};
}
function cellInRow(row,ref){
  const re=new RegExp('<c\\s+r="'+ref+'"[^>]*(?:\\/>|>[\\s\\S]*?<\\/c>)');
  return row.match(re);
}
function replaceCell(xml,ref,make){
  const mref=/^([A-Z]+)(\d+)$/.exec(ref);
  if(!mref) throw new Error('Ungültige Zelladresse '+ref);
  const r=+mref[2], rb=rowBlock(xml,r), row=rb.text, cm=cellInRow(row,ref);
  if(cm){
    const old=cm[0];
    const am=/^<c\s+r="[^"]+"([^>]*)/.exec(old);
    const attrs=am?am[1]:'';
    const neu=make(attrs);
    const nr=row.slice(0,cm.index)+neu+row.slice(cm.index+old.length);
    return xml.slice(0,rb.index)+nr+xml.slice(rb.index+row.length);
  }
  const col=mref[1];
  let style='';
  const sm=new RegExp('<c\\s+r="'+col+'\\d+"([^>]*)').exec(row);
  if(sm) style=sm[1];
  const neu=make(style);
  const nr=row.replace('</row>',neu+'</row>');
  return xml.slice(0,rb.index)+nr+xml.slice(rb.index+row.length);
}
function setNumber(xml,ref,value){return replaceCell(xml,ref,attrs=>'<c r="'+ref+'"'+attrs.replace(/\s+t="[^"]*"/g,'')+' t="n"><v>'+value+'</v></c>')}
function setInline(xml,ref,value){return replaceCell(xml,ref,attrs=>'<c r="'+ref+'"'+attrs.replace(/\s+t="[^"]*"/g,'')+' t="inlineStr"><is><t>'+esc(value)+'</t></is></c>')}
function setCache(xml,ref,value){
  const mref=/^([A-Z]+)(\d+)$/.exec(ref); if(!mref)return xml;
  const r=+mref[2], rb=rowBlock(xml,r), row=rb.text;
  const re=new RegExp('(<c\\s+r="'+ref+'"[^>]*>)([\\s\\S]*?)(<\\/c>)');
  const m=row.match(re); if(!m)return xml;
  if(!/<f>[\s\S]*?<\/f>/.test(m[2]))return xml;
  const body=/<v>[\s\S]*?<\/v>/.test(m[2])?m[2].replace(/<v>[\s\S]*?<\/v>/,'<v>'+value+'</v>'):m[2]+'<v>'+value+'</v>';
  const nr=row.slice(0,m.index)+m[1]+body+m[3]+row.slice(m.index+m[0].length);
  return xml.slice(0,rb.index)+nr+xml.slice(rb.index+row.length);
}
function excelDate(s){const [y,m,d]=s.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000)}
function excelTime(s){return mins(s)/1440}
function findRows(xml){
  const out=[]; const re=/<row\b[^>]*\br="(\d+)"[^>]*>[\s\S]*?<\/row>/g; let m;
  while((m=re.exec(xml))){const r=+m[1]; if(r>=8&&r<=34&&r%2===0) out.push(r)}
  return out;
}
function setFormulaCalcPr(wb){if(/<calcPr\b/.test(wb))return wb.replace(/<calcPr\b[^>]*\/>/,'<calcPr fullCalcOnLoad="1" forceFullCalc="1" calcMode="auto"/>');return wb.replace('</workbook>','<calcPr fullCalcOnLoad="1" forceFullCalc="1" calcMode="auto"/></workbook>')}
$("make").addEventListener("click",async()=>{if(!sourceFile)return alert("Bitte zuerst die originale Excel-Vorlage auswählen.");if(!entries.length)return alert("Bitte mindestens einen Eintrag hinzufügen.");if(typeof JSZip==="undefined")return alert("Excel-Bibliothek nicht geladen. Seite neu laden.");try{const zip=await JSZip.loadAsync(await sourceFile.arrayBuffer());const sf=zip.file("xl/worksheets/sheet1.xml"),wf=zip.file("xl/workbook.xml");if(!sf||!wf)throw new Error("Ungültige XLSX-Vorlage.");let xml=await sf.async("string"),wb=await wf.async("string");const rows=findRows(xml);if(entries.length>rows.length)throw new Error("Die Vorlage bietet nur "+rows.length+" Eintragszeilen.");entries.sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from));
for(const r of rows){xml=setNumber(xml,"C"+r,0);xml=setNumber(xml,"F"+r,0);xml=setNumber(xml,"H"+r,0);xml=setInline(xml,"N"+r,"");xml=setNumber(xml,"L"+r,14);xml=setCache(xml,"A"+r,0);xml=setCache(xml,"I"+r,0);xml=setCache(xml,"J"+r,0);xml=setCache(xml,"K"+r,0);xml=setCache(xml,"M"+r,0)}
let sumRaw=0,sumTotal=0,sumEuro=0;entries.forEach((e,i)=>{const r=rows[i],c=calc(e);sumRaw+=c.raw;sumTotal+=c.total;sumEuro+=c.euro;xml=setNumber(xml,"C"+r,excelDate(e.date));xml=setNumber(xml,"F"+r,excelTime(e.from));xml=setNumber(xml,"H"+r,excelTime(e.to));xml=setInline(xml,"N"+r,e.activity);xml=setCache(xml,"A"+r,excelDate(e.date));xml=setCache(xml,"I"+r,c.raw);xml=setCache(xml,"J"+r,c.pause);xml=setCache(xml,"K"+r,c.total);xml=setNumber(xml,"L"+r,14);xml=setCache(xml,"M"+r,c.euro)});
// Wochensumme anhand der vorhandenen Formel-Zeile finden und ihre berechneten Werte aktualisieren.
const sm=/<row\b[^>]*\br="(\d+)"[^>]*>[\s\S]*?<f>SUM\(I8:I[^<]+<\/f>[\s\S]*?<\/row>/.exec(xml);if(sm){const r=+sm[1];xml=setCache(xml,"I"+r,sumRaw);xml=setCache(xml,"K"+r,sumTotal);xml=setCache(xml,"M"+r,sumEuro)}
const first=entries[0],dt=new Date(first.date+"T12:00:00"),month=dt.toLocaleDateString("de-DE",{month:"long"});xml=setInline(xml,"Q4",month);xml=setNumber(xml,"S4",kwOf(first.date));wb=setFormulaCalcPr(wb);zip.file("xl/worksheets/sheet1.xml",xml);zip.file("xl/workbook.xml",wb);const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="KW"+String(kwOf(first.date)).padStart(2,"0")+".xlsx";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);alert("Fertig: "+a.download)}catch(err){console.error(err);alert("Fehler beim Erstellen: "+(err.message||err))}});
updatePeriod();render();
</script></body></html>
