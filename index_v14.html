<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stundennachweis</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:600px;margin:auto;padding:20px 16px 40px}h1{font-size:29px;margin:5px 0 2px}.period{color:#007aff;font-weight:600;font-size:17px;margin-bottom:20px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 5px #0001}label{display:block;font-size:13px;font-weight:600;color:#666;margin:10px 0 6px}input{width:100%;padding:13px;border:1px solid #d1d1d6;border-radius:11px;font-size:17px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;margin-top:14px;background:#007aff;color:#fff}button.gray{background:#e5e5ea;color:#111}.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.small{color:#666;font-size:14px}button.red{width:auto;background:#ff3b30;padding:7px 10px;font-size:13px;margin:0}.green{background:#34c759}.ok{color:#16883a;font-weight:600}</style></head><body><main><h1>Stundennachweis</h1><div class="period" id="period">Noch kein Datum</div><div class="card"><label>Excel-Vorlage</label><input id="file" type="file" accept=".xlsx"><div id="fileinfo" class="small" style="margin-top:8px">Bitte die funktionierende Excel-Vorlage auswählen.</div></div><div class="card"><label>Datum</label><input id="date" type="date"><div class="row"><div><label>Von</label><input id="from" type="time"></div><div><label>Bis</label><input id="to" type="time"></div></div><label>Tätigkeit</label><input id="activity" placeholder="z. B. Lagerarbeiten"><button id="add">+ Eintrag hinzufügen</button></div><div class="card"><div id="list"><div class="small">Noch keine Einträge.</div></div><button id="make" class="green">KW-Datei erstellen</button><button id="clear" class="gray">Liste leeren</button></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>
const $=id=>document.getElementById(id);let sourceFile=null,entries=[];
function kwOf(s){const d=new Date(s+'T12:00:00'),day=(d.getDay()+6)%7;d.setDate(d.getDate()+3-day);const y=d.getFullYear();const first=new Date(y,0,4),fd=(first.getDay()+6)%7;return 1+Math.floor(((d-first)/86400000+fd)/7)}
function mins(s){const [h,m]=s.split(':').map(Number);return h*60+m}
function updatePeriod(){const d=$("date").value;if(!d){$("period").textContent="Noch kein Datum";return}const dt=new Date(d+'T12:00:00');$("period").textContent=dt.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})+' · KW '+kwOf(d)}
function calc(e){let raw=(mins(e.to)-mins(e.from))/60;if(raw<0)raw+=24;const pause=raw>=6?1:raw>=4.5?.5:0;return{raw,total:raw-pause,euro:(raw-pause)*14,pause}}
function render(){if(!entries.length){$("list").innerHTML='<div class="small">Noch keine Einträge.</div>';return}entries.sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from));$("list").innerHTML=entries.map((e,i)=>{const c=calc(e);return `<div class="entry"><div><b>${new Date(e.date+'T12:00:00').toLocaleDateString('de-DE')}</b> · ${e.from}–${e.to} Uhr<br><span class="small">${e.activity} · KW ${kwOf(e.date)} · ${c.total.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})} h · ${c.euro.toLocaleString('de-DE',{minimumFractionDigits:2})} €</span></div><button class="red" onclick="delEntry(${i})">Löschen</button></div>`}).join('')}
function delEntry(i){entries.splice(i,1);render()}
$("file").addEventListener('change',e=>{sourceFile=e.target.files[0]||null;$("fileinfo").innerHTML=sourceFile?'<span class="ok">✓ '+sourceFile.name+' ausgewählt</span>':'Bitte die funktionierende Excel-Vorlage auswählen.'});$("date").addEventListener('change',updatePeriod);
$("add").addEventListener('click',()=>{const d=$("date").value,f=$("from").value,t=$("to").value,a=$("activity").value.trim();if(!d||!f||!t||!a)return alert('Bitte Datum, Von, Bis und Tätigkeit ausfüllen.');if(mins(t)<=mins(f))return alert('Die Bis-Zeit muss nach der Von-Zeit liegen.');if(entries.length&&kwOf(d)!==kwOf(entries[0].date))return alert('Bitte nur Einträge derselben Kalenderwoche eingeben.');entries.push({date:d,from:f,to:t,activity:a});$("activity").value='';render();updatePeriod()});
$("clear").addEventListener('click',()=>{if(confirm('Alle Einträge wirklich löschen?')){entries=[];render()}});
function excelDate(s){const [y,m,d]=s.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000)}function excelTime(s){return mins(s)/1440}
function localName(cell){return cell.getAttribute('r')||''}
function findCell(row,ref){for(const c of row.children){if(localName(c)===ref)return c}return null}
function setCell(row,ref,value,type){let c=findCell(row,ref);if(!c){c=row.ownerDocument.createElementNS('http://schemas.openxmlformats.org/spreadsheetml/2006/main','c');c.setAttribute('r',ref);let col=ref.match(/^[A-Z]+/)[0];let peer=[...row.children].find(x=>{const rr=x.getAttribute('r')||'';return rr.startsWith(col)});if(peer)row.insertBefore(c,peer);else row.appendChild(c)}const f=c.querySelector(':scope > f');if(f){let v=c.querySelector(':scope > v');if(!v){v=row.ownerDocument.createElementNS(c.namespaceURI,'v');c.appendChild(v)}v.textContent=String(value);return}for(const a of [...c.attributes])if(a.name==='t')c.removeAttribute('t');while(c.firstChild)c.removeChild(c.firstChild);if(type==='inline'){c.setAttribute('t','inlineStr');const is=row.ownerDocument.createElementNS(c.namespaceURI,'is');const t=row.ownerDocument.createElementNS(c.namespaceURI,'t');t.textContent=String(value);is.appendChild(t);c.appendChild(is)}else{c.setAttribute('t','n');const v=row.ownerDocument.createElementNS(c.namespaceURI,'v');v.textContent=String(value);c.appendChild(v)}}
function getRows(doc){const rows=[...doc.getElementsByTagNameNS('http://schemas.openxmlformats.org/spreadsheetml/2006/main','row')];return rows.filter(r=>{const n=Number(r.getAttribute('r'));return n>=8&&n<=34&&n%2===0})}
function setFormulaValue(row,ref,value){const c=findCell(row,ref);if(!c)return;const f=c.querySelector(':scope > f');if(!f)return;let v=c.querySelector(':scope > v');if(!v){v=row.ownerDocument.createElementNS(c.namespaceURI,'v');c.appendChild(v)}v.textContent=String(value)}
function setCalcPr(wb){if(wb.includes('<calcPr'))return wb.replace(/<calcPr\b[^>]*\/?\s*>/,'<calcPr fullCalcOnLoad="1" forceFullCalc="1" calcMode="auto"/>');return wb.replace('</workbook>','<calcPr fullCalcOnLoad="1" forceFullCalc="1" calcMode="auto"/></workbook>')}
$("make").addEventListener('click',async()=>{if(!sourceFile)return alert('Bitte zuerst die originale Excel-Vorlage auswählen.');if(!entries.length)return alert('Bitte mindestens einen Eintrag hinzufügen.');if(typeof JSZip==='undefined')return alert('Excel-Bibliothek nicht geladen. Seite neu laden.');try{const zip=await JSZip.loadAsync(await sourceFile.arrayBuffer());const sf=zip.file('xl/worksheets/sheet1.xml'),wf=zip.file('xl/workbook.xml');if(!sf||!wf)throw new Error('Ungültige XLSX-Vorlage.');let xml=await sf.async('string'),wb=await wf.async('string');const parser=new DOMParser(),doc=parser.parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))throw new Error('Die Excel-Tabelle konnte nicht gelesen werden.');const rows=getRows(doc);if(entries.length>rows.length)throw new Error('Die Vorlage bietet nur '+rows.length+' Eintragszeilen.');entries.sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from));let sumRaw=0,sumTotal=0,sumEuro=0;for(const r of rows){const rn=Number(r.getAttribute('r'));setCell(r,'C'+rn,0,'num');setCell(r,'F'+rn,0,'num');setCell(r,'H'+rn,0,'num');setCell(r,'N'+rn,'','inline');setCell(r,'L'+rn,14,'num');setFormulaValue(r,'A'+rn,0);setFormulaValue(r,'I'+rn,0);setFormulaValue(r,'J'+rn,0);setFormulaValue(r,'K'+rn,0);setFormulaValue(r,'M'+rn,0)}entries.forEach((e,i)=>{const r=rows[i],rn=Number(r.getAttribute('r')),c=calc(e);sumRaw+=c.raw;sumTotal+=c.total;sumEuro+=c.euro;setCell(r,'C'+rn,excelDate(e.date),'num');setCell(r,'F'+rn,excelTime(e.from),'num');setCell(r,'H'+rn,excelTime(e.to),'num');setCell(r,'N'+rn,e.activity,'inline');setCell(r,'L'+rn,14,'num');setFormulaValue(r,'A'+rn,excelDate(e.date));setFormulaValue(r,'I'+rn,c.raw);setFormulaValue(r,'J'+rn,c.pause);setFormulaValue(r,'K'+rn,c.total);setFormulaValue(r,'M'+rn,c.euro)});const sumRow=rows.length?null:null;for(const r of [...doc.getElementsByTagNameNS('http://schemas.openxmlformats.org/spreadsheetml/2006/main','row')]){const rn=Number(r.getAttribute('r'));if(rn>=35&&rn<=45){setFormulaValue(r,'I'+rn,sumRaw);setFormulaValue(r,'K'+rn,sumTotal);setFormulaValue(r,'M'+rn,sumEuro)}}const q4=[...doc.getElementsByTagNameNS('http://schemas.openxmlformats.org/spreadsheetml/2006/main','row')].find(r=>Number(r.getAttribute('r'))===4);if(q4){setCell(q4,'Q4',new Date(entries[0].date+'T12:00:00').toLocaleDateString('de-DE',{month:'long'}),'inline');setCell(q4,'S4',kwOf(entries[0].date),'num')}const serializer=new XMLSerializer();xml=serializer.serializeToString(doc);wb=setCalcPr(wb);zip.file('xl/worksheets/sheet1.xml',xml);zip.file('xl/workbook.xml',wb);const bytes=await zip.generateAsync({type:'uint8array',compression:'DEFLATE'});const filename='KW'+String(kwOf(entries[0].date)).padStart(2,'0')+'.xlsx';const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const file=new File([blob],filename,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});}else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}}catch(err){console.error(err);alert('Fehler beim Erstellen: '+(err.message||err))}});updatePeriod();render();</script></body></html>
